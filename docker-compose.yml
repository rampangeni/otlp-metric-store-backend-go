version: "3.9"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.2
    container_name: clickhouse
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "8123:8123"

    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: password

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "app", "--password", "password", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10